[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkypull"
version = "0.1.0"
description = "Pull an image from a URL and show it on a Pimoroni Inky e-paper display"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware",
]
dependencies = [
    "httpx>=0.27",
    "pillow>=10.1",
]

[project.optional-dependencies]
# Usually already installed on the Pi by Pimoroni's installer; listed so a
# fresh venv can pull it in with `pip install inkypull[pi]`.
pi = ["inky>=2.0"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
inkypull = "inkypull.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkypull"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
